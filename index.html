<style>
  /* Deep and jewel-like, but never harsh. The eye strain in the earlier pass
     came from a white hotspot on a near-black ground, not from the darkness or
     the colour — so the light inside each pad is tinted, the aura is low-alpha,
     and nothing sits near pure white. */
  :root {
    /* Deep night ground — the drama comes from here, not from bright surfaces */
    --ground:   #1B1240;
    --ground-2: #120B2C;
    --panel:    rgba(255,255,255,.06);
    --panel-line: rgba(255,255,255,.12);
    --ink:      #F0EBFF;
    --ink-soft: #A99BD8;

    /* rich, saturated note colours — depth comes from saturation, not lightness */
    --do:  #F2564C;
    --re:  #F79433;
    --mi:  #F2C528;
    --fa:  #3FC876;
    --sol: #4A9BF5;
    --la:  #9B6BF5;
    --si:  #E86BC8;

    /* pale tints for the note heads on the staff, so each friend's face reads */
    --do-light:  #FBD5D2;
    --re-light:  #FDE2C8;
    --mi-light:  #FBEFC4;
    --fa-light:  #CFF0DC;
    --sol-light: #D2E5FB;
    --la-light:  #E2D6FD;
    --si-light:  #FAD7EF;

    --wand: #FFD36E;
    --shadow: rgba(0,0,0,.5);

    /* the clef asset is a dark engraving: inverted on night, left alone on day */
    --clef-filter: brightness(0) invert(1);
    --clef-alpha: .92;
    /* the dark that shades the bottom of each pad */
    --pad-shade: #100A28;
  }

  body[data-look="day"] {
    --ground:   #F1EDFB;
    --ground-2: #E4DDF4;
    --panel:    #FFFFFF;
    --panel-line: rgba(45,28,95,.14);
    --ink:      #241A4E;
    --ink-soft: #6A5C99;
    --shadow:   rgba(45,28,95,.20);
    --clef-filter: none;
    --clef-alpha: .88;
    --pad-shade: #2A1C5E;
  }


  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    direction: rtl;
    background: linear-gradient(180deg, var(--ground), var(--ground-2));
    color: var(--ink);
    font-family: "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(.8rem, 2.4vw, 1.5rem);
    /* the home button is fixed at the top-left; the page starts below it */
    padding: clamp(4rem, 8vw, 4.5rem) clamp(.9rem, 3vw, 2rem) clamp(.9rem, 3vw, 2rem);
    transition: background .25s ease, color .25s ease;
  }

  header { text-align: center; }
  h1 { margin: 0; font-size: clamp(1.1rem, 4.4vw, 1.85rem); font-weight: 800; letter-spacing: -.01em; }
  header p { margin: .25rem 0 0; color: var(--ink-soft); font-size: clamp(.8rem, 2.9vw, 1rem); }


  .look {
    position: absolute; top: .75rem; right: .75rem;
    border: 1px solid var(--panel-line); background: var(--panel);
    color: var(--ink-soft); font: inherit; font-size: .76rem; font-weight: 700;
    padding: .42rem .82rem; border-radius: 999px; cursor: pointer;
  }
  .look:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 3px; }

  /* ---------- the five character pads ---------- */
  .pads {
    direction: ltr;   /* do on the left, rising to si — as on the staff */
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(.4rem, 1.7vw, .85rem);
    width: 100%; max-width: 46rem; padding-bottom: 1.6rem;
  }

  .pad {
    position: relative;
    width: clamp(3.5rem, 12.6vw, 5.6rem);
    aspect-ratio: 1;
    border: 0; padding: 0; margin: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* A deep jewel of the note's own colour. The light inside it is coloured,
     never white — a white hotspot on a dark ground is what strained the eye.
     Depth comes from the gradient and the inner shadow, not from brightness. */
  .pad .body {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 32%,
        color-mix(in srgb, var(--tone) 78%, #fff) 0%,
        var(--tone) 46%,
        color-mix(in srgb, var(--tone) 72%, var(--pad-shade)) 100%);
    border: .28rem solid color-mix(in srgb, var(--tone) 14%, #fff);
    box-shadow:
      0 0 .3rem .01rem color-mix(in srgb, var(--tone) 95%, transparent),
      0 0 .75rem .05rem color-mix(in srgb, var(--tone) 70%, transparent),
      inset 0 0 .55rem .03rem color-mix(in srgb, var(--tone) 55%, #fff),
      0 0 1.7rem .1rem color-mix(in srgb, var(--tone) 32%, transparent),
      0 .7rem 1.4rem -.5rem rgba(0,0,0,.7),
      inset 0 -.5rem .9rem color-mix(in srgb, var(--pad-shade) 55%, transparent),
      inset 0 .25rem .5rem color-mix(in srgb, var(--tone) 60%, #fff);
    transition: transform .13s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
    overflow: hidden;
  }

  /* a slow, faint breath so the pads feel alive without ever getting brighter */
  .pad .body { animation: breathe 4.5s ease-in-out infinite; }
  .pad:nth-child(2) .body { animation-delay: -.9s; }
  .pad:nth-child(3) .body { animation-delay: -1.8s; }
  .pad:nth-child(4) .body { animation-delay: -2.7s; }
  .pad:nth-child(5) .body { animation-delay: -3.6s; }
  .pad:nth-child(6) .body { animation-delay: -1.35s; }
  .pad:nth-child(7) .body { animation-delay: -2.25s; }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 .42rem .02rem color-mix(in srgb, var(--tone) 80%, transparent),
                          inset 0 0 .5rem .02rem color-mix(in srgb, var(--tone) 45%, #fff),
                          0 0 1.5rem .05rem color-mix(in srgb, var(--tone) 26%, transparent),
                          0 .7rem 1.4rem -.5rem rgba(0,0,0,.7),
                          inset 0 -.5rem .9rem color-mix(in srgb, var(--pad-shade) 55%, transparent),
                          inset 0 .25rem .5rem color-mix(in srgb, var(--tone) 60%, #fff); }
    50%     { box-shadow: 0 0 .6rem .05rem color-mix(in srgb, var(--tone) 95%, transparent),
                          inset 0 0 .55rem .03rem color-mix(in srgb, var(--tone) 55%, #fff),
                          0 0 2.1rem .16rem color-mix(in srgb, var(--tone) 40%, transparent),
                          0 .7rem 1.4rem -.5rem rgba(0,0,0,.7),
                          inset 0 -.5rem .9rem color-mix(in srgb, var(--pad-shade) 55%, transparent),
                          inset 0 .25rem .5rem color-mix(in srgb, var(--tone) 60%, #fff); }
  }

  /* a gentle sheen across the top, tinted rather than white */
  .pad .sheen {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: linear-gradient(160deg,
      color-mix(in srgb, #fff 34%, transparent) 0%,
      color-mix(in srgb, #fff 8%, transparent) 30%,
      transparent 52%);
  }

  .pad .who {
    position: absolute; left: 6%; right: 6%; bottom: 0; top: 7%;
    background-repeat: no-repeat; background-position: center bottom; background-size: contain;
    pointer-events: none;
  }

  .pad .name {
    position: absolute; left: 0; right: 0; bottom: -1.45rem;
    text-align: center; font-weight: 800;
    font-size: clamp(.82rem, 3.2vw, 1.05rem);
    color: color-mix(in srgb, var(--tone) 62%, #fff);
    pointer-events: none;
  }

  /* The press is the only moment anything brightens, and only for an instant. */
  .pad:active .body {
    transform: scale(.93);
    box-shadow:
      0 0 2.6rem .3rem color-mix(in srgb, var(--tone) 55%, transparent),
      inset 0 -.5rem .9rem color-mix(in srgb, var(--pad-shade) 55%, transparent),
      inset 0 .25rem .5rem color-mix(in srgb, var(--tone) 70%, #fff);
  }
  .pad:focus-visible { outline: 3px solid var(--tone); outline-offset: 5px; }

  /* Three rings leaving at staggered moments, the way water answers a stone. */
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: .2rem solid var(--tone);
    opacity: 0; pointer-events: none;
  }
  .ring.go { animation: bloom .9s cubic-bezier(.16,.8,.3,1) forwards; }
  /* declared after .go: the shorthand above resets the delay */
  .ring.r2.go { animation-delay: .13s; }
  .ring.r3.go { animation-delay: .26s; }
  @keyframes bloom {
    0%   { opacity: .85; transform: scale(1);    border-width: .26rem; }
    100% { opacity: 0;   transform: scale(2.35); border-width: .03rem; }
  }

  /* The note sounding right now, in both places at once. */
  .note { transition: transform .12s ease; transform-box: fill-box; transform-origin: center; }
  .note.lit { transform: scale(1.28); }
  .note.lit circle[fill="none"] { stroke-width: 4.5; }

  .pad.lit .body {
    animation: none;
    box-shadow:
      0 0 2.6rem .3rem color-mix(in srgb, var(--tone) 60%, transparent),
      inset 0 -.5rem .9rem color-mix(in srgb, var(--pad-shade) 55%, transparent),
      inset 0 .25rem .5rem color-mix(in srgb, var(--tone) 75%, #fff);
    transform: scale(1.06);
  }

  /* ---------- the magic wand ---------- */
  .wand {
    position: absolute; top: .6rem; right: 50%; transform: translateX(50%);
    width: 3.6rem; height: 3.6rem; border: 0; padding: 0; background: transparent;
    cursor: pointer; touch-action: manipulation; z-index: 5;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
  }
  .wand.here { opacity: 1; pointer-events: auto; animation: hover 2.4s ease-in-out infinite; }
  .wand.held { animation: none; filter: drop-shadow(0 0 .5rem var(--wand)); }
  .wand svg { width: 100%; height: 100%; display: block; }
  @keyframes hover {
    0%,100% { transform: translateX(50%) translateY(0)     rotate(-8deg); }
    50%     { transform: translateX(50%) translateY(-.4rem) rotate(4deg); }
  }
  .wand .spark { transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
  .wand .spark.b { animation-delay: .5s; }
  .wand .spark.c { animation-delay: 1s; }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* while the wand is held, every note offers itself */
  .note.pickable { cursor: pointer; animation: offer 1s ease-in-out infinite; }
  @keyframes offer { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }

  /* a long note: the stem is gone and the ring doubles, so it reads as bigger */
  .note.whole circle[fill="none"] { stroke-width: 5.5; }

  /* ---------- the staff ---------- */
  .stage {
    width: 100%; max-width: 46rem;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 1.2rem;
    padding: clamp(.7rem, 2.4vw, 1.1rem);
    box-shadow: 0 .4rem 1rem -.6rem var(--shadow);
  }
  .scroll { overflow-x: auto; overflow-y: hidden; }
  svg.staff { display: block; height: clamp(9rem, 27vw, 11.5rem); }
  .empty { color: var(--ink-soft); text-align: center; font-size: clamp(.78rem,2.8vw,.95rem); padding: .3rem 0 .1rem; }

  /* ---------- controls ---------- */
  .tools { display: flex; gap: .55rem; flex-wrap: wrap; justify-content: center; }
  .tool {
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--ink); font: inherit; font-weight: 700;
    font-size: clamp(.83rem, 2.9vw, 1rem);
    padding: .6rem 1.15rem; border-radius: 999px;
    cursor: pointer; min-height: 2.9rem;
    transition: transform .12s ease;
    box-shadow: 0 .25rem .6rem -.4rem var(--shadow);
  }
  .tool:active { transform: scale(.96); }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 3px; }

  /* the wand just changed a note - the play button says "come hear it" */
  .tool.calling {
    border-color: var(--wand);
    animation: calling 1.9s ease-in-out infinite;
  }
  @keyframes calling {
    0%, 100% { box-shadow: 0 0 0 .12rem rgba(255,211,110,.28), 0 0 .8rem rgba(255,211,110,.30); }
    50%      { box-shadow: 0 0 0 .26rem rgba(255,211,110,.50), 0 0 1.7rem rgba(255,211,110,.68); }
  }
  /* while the call is out, the other two step back so the eye has one place to go */
  .tool.hushed { opacity: .5; }
  /* a small hop, twice, for a child who has not noticed the gold yet */
  .tool.calling.nudge { animation: calling 1.9s ease-in-out infinite, hop .55s ease; }
  @keyframes hop {
    0%, 100% { transform: none; }
    35%      { transform: translateY(-5px) scale(1.05); }
    70%      { transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring.go { animation-duration: .01ms; }
    .pad .body { animation: none; }
    .pad .body, .tool, body { transition: none; }
    .tool.calling, .tool.calling.nudge {
      animation: none; transform: none;
      box-shadow: 0 0 0 .2rem rgba(255,211,110,.45);
    }
  }

  /* ---------- Sol home button (unified turquoise) ---------- */
  .sol-home-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 200;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .sol-home-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
  .sol-home-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
  .sol-home-btn svg { width: 26px; height: 26px; }
  @media (max-width: 640px) {
    .sol-home-btn { width: 44px; height: 44px; top: 8px; left: 8px; }
    .sol-home-btn svg { width: 22px; height: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sol-home-btn { transition: none; }
    .sol-home-btn:hover { transform: none; }
  }
</style>

  <h1>עיגולי הצלילים של סול</h1>

      <path class="spark" d="M34 6 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z" fill="var(--wand)"/>
      <path class="spark b" d="M12 10 l1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3z" fill="var(--wand)"/>
      <path class="spark c" d="M40 28 l1.1 2.7 2.7 1.1 -2.7 1.1 -1.1 2.7 -1.1 -2.7 -2.7 -1.1 2.7 -1.1z" fill="var(--wand)"/>

const SVG = 'http://www.w3.org/2000/svg';
const STAFF_LINES = [40, 55, 70, 85, 100];
const LEFT = 96;
const STEP = 52;
const melody = [];

let ctx = null;
function audio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function playTone(freq, when = 0, dur = 0.75) {
  const ac = audio();
  const t0 = ac.currentTime + when;
  const gain = ac.createGain();
  gain.connect(ac.destination);

  // The long notes are the reason this is an envelope and not a decay: a note
  // held for four beats has to still be sounding at the fourth one.
  const peak = 0.34;
  const hold = peak * 0.72;
  const release = Math.min(0.3, dur * 0.35);
  const settle = Math.min(0.16, dur * 0.25);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(hold, t0 + 0.012 + settle);
  gain.gain.setValueAtTime(hold, t0 + Math.max(0.03, dur - release));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  [[1, 0.55], [2, 0.16], [3, 0.06]].forEach(([mult, level], k) => {
    const osc = ac.createOscillator();
    osc.type = 'sine';
    // a couple of cents of drift between the partials keeps a held note alive
    osc.frequency.setValueAtTime(freq * mult * (k === 1 ? 1.0015 : 1), t0);
    const g = ac.createGain();
    g.gain.setValueAtTime(level, t0);
    osc.connect(g); g.connect(gain);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  });
}

const padsEl = document.getElementById('pads');
NOTES.forEach(n => {
  const b = document.createElement('button');
  b.className = 'pad';
  b.style.setProperty('--tone', `var(--${n.id})`);
  b.setAttribute('aria-label', `נגנו ${n.name}`);
  b.innerHTML =
    `<span class="body"><span class="who" style="background-image:url('${n.img}')"></span><span class="sheen"></span></span>` +
    `<span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>` +
    `<span class="name">${n.name}</span>`;
  b.addEventListener('pointerdown', e => { e.preventDefault(); hit(n, b); });
  padsEl.appendChild(b);
});

function hit(note, btn) {
  playTone(note.freq);
  btn.querySelectorAll('.ring').forEach(ring => {
    ring.classList.remove('go');
    void ring.offsetWidth;          // restart the animation on a rapid re-tap
    ring.classList.add('go');
  });
  melody.push(note);
  draw();
  startWandCycle();
}

function el(tag, attrs) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function clef(staff) {
  const h = 112;
  staff.appendChild(el('image', {
    href: CLEF_SRC, x: 20, y: 14, width: h * 0.4675, height: h,
    preserveAspectRatio: 'xMidYMid meet',
    // the asset is a dark engraving; flattening it to white keeps its shape
    style: 'filter: var(--clef-filter); opacity: var(--clef-alpha)'
  }));
}

function draw() {
  const staff = document.getElementById('staff');
  // The panel is wider than the notes need, and in a right-to-left page the
  // drawing would hug the right edge and leave the left half empty. Widen the
  // drawing to whatever the panel offers, and only scroll once notes exceed it.
  const box = staff.parentElement.clientWidth || 430;
  const drawnHeight = staff.getBoundingClientRect().height || 160;
  const unitsPerPx = 166 / drawnHeight;
  const fits = Math.floor(box * unitsPerPx);
  const needed = LEFT + STEP * (melody.length + 1);
  // fit the panel first; only grow past it once the melody actually needs more
  const width = Math.max(300, fits, needed);
  staff.setAttribute('viewBox', `0 0 ${width} 166`);
  // the width attribute is read as pixels, while width above is in drawing
  // units — convert, or the staff overflows its panel on a phone
  staff.setAttribute('width', Math.round(width * (drawnHeight / 166)));
  staff.textContent = '';

  const lineCol = getComputedStyle(document.body).getPropertyValue('--ink-soft').trim();
  STAFF_LINES.forEach(y => staff.appendChild(
    el('line', { x1: 12, y1: y, x2: width - 12, y2: y, stroke: lineCol, 'stroke-width': 1.8, opacity: .55 })
  ));
  clef(staff);

  melody.forEach((n, i) => {
    const cx = LEFT + STEP * i + STEP / 2;
    const g = el('g', { class: 'note' + (n.whole ? ' whole' : ''), 'data-i': i });
    staff.appendChild(g);
    if (n.ledger) g.appendChild(
      el('line', { x1: cx - 23, y1: n.y, x2: cx + 23, y2: n.y, stroke: lineCol, 'stroke-width': 1.8, opacity: .55 })
    );
    const R = 15;
    // Notation rule: a note below the middle line (סי, y=70 here) takes an
    // upward stem. All five of do..sol sit below it, so all five stem up.
    const up = n.y > 70;
    // a whole note carries no stem — that is what marks it as long
    if (!n.whole) g.appendChild(el('line', {
      x1: up ? cx + R - 3 : cx - R + 3, y1: n.y,
      x2: up ? cx + R - 3 : cx - R + 3, y2: up ? n.y - 46 : n.y + 46,
      stroke: 'var(--' + n.id + ')', 'stroke-width': 3, 'stroke-linecap': 'round'
    }));

    // The head carries the friend's face, so the child ties the name to the
    // place on the staff rather than memorising a bare dot.
    const clipId = 'head' + i;
    const defs = el('defs', {});
    const cp = el('clipPath', { id: clipId });
    cp.appendChild(el('circle', { cx: cx, cy: n.y, r: R - 2 }));
    defs.appendChild(cp);
    g.appendChild(defs);

    g.appendChild(el('circle', {
      cx: cx, cy: n.y, r: R - 2,
      // pale fill so the friend's face stays readable at this size
      fill: 'var(--' + n.id + '-light)'
    }));
    g.appendChild(el('image', {
      href: n.img, x: cx - (R - 2), y: n.y - (R - 2),
      width: (R - 2) * 2, height: (R - 2) * 2,
      preserveAspectRatio: 'xMidYMax slice',
      'clip-path': 'url(#' + clipId + ')'
    }));
    g.appendChild(el('circle', {
      cx: cx, cy: n.y, r: R - 1, fill: 'none',
      stroke: 'var(--' + n.id + ')', 'stroke-width': 3
    }));

    const label = el('text', {
      x: cx, y: 156, fill: 'var(--' + n.id + ')', 'font-size': 15,
      'font-weight': 700, 'text-anchor': 'middle'
    });
    label.textContent = n.name;
    g.appendChild(label);
  });

  document.getElementById('empty').style.display = melody.length ? 'none' : 'block';
  ['play', 'undo', 'clear'].forEach(id => document.getElementById(id).disabled = !melody.length);
  if (!melody.length) callAnswered();
}

const BEAT = 0.42;          // seconds between notes, matching the audio schedule
let playTimers = [];

function stopHighlights() {
  playTimers.forEach(clearTimeout);
  playTimers = [];
  document.querySelectorAll('.pad.lit, .note.lit').forEach(e => e.classList.remove('lit'));
}

// A short, quiet twinkle aimed at the button - not the wand's own arrival chime,
// which is longer and announces the wand instead of the change it made.
function callChime() {
  const ac = audio();
  const t0 = ac.currentTime + 0.02;
  [784.0, 1046.5, 1318.5].forEach((f, i) => {
    const at = t0 + i * 0.07;
    const g = ac.createGain();
    g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.06, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.42);
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, at);
    osc.connect(g);
    osc.start(at); osc.stop(at + 0.45);
  });
}

// The call stays lit until the child presses it. A four-year-old who hesitates
// should not lose the hint while deciding - so nothing here is a deadline; the
// reminders only repeat twice and then leave the gold standing on its own.
const NUDGE_AFTER = 6000;
const NUDGE_TIMES = 2;
let nudgeTimer = null;
let nudgesLeft = 0;

function callPlay() {
  const btn = document.getElementById('play');
  if (btn.disabled) return;
  btn.classList.add('calling');
  document.getElementById('undo').classList.add('hushed');
  document.getElementById('clear').classList.add('hushed');
  callChime();
  nudgesLeft = NUDGE_TIMES;
  scheduleNudge();
}

function scheduleNudge() {
  clearTimeout(nudgeTimer);
  if (nudgesLeft <= 0) return;
  nudgeTimer = setTimeout(() => {
    const btn = document.getElementById('play');
    if (!btn.classList.contains('calling')) return;
    nudgesLeft--;
    callChime();
    btn.classList.remove('nudge');
    void btn.offsetWidth;            // restart the hop on a repeat reminder
    btn.classList.add('nudge');
    scheduleNudge();
  }, NUDGE_AFTER);
}

function callAnswered() {
  clearTimeout(nudgeTimer);
  nudgesLeft = 0;
  document.getElementById('play').classList.remove('calling', 'nudge');
  document.getElementById('undo').classList.remove('hushed');
  document.getElementById('clear').classList.remove('hushed');
}

document.getElementById('play').addEventListener('click', () => {
  callAnswered();
  stopHighlights();
  // start the eye where the melody starts, not where the child last scrolled
  const first = document.querySelector('.note[data-i="0"]');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  let when = 0;
  melody.forEach((n, i) => {
    const beats = n.whole ? 4 : 1;
    playTone(n.freq, when, beats * BEAT * 0.97);
    const at = when * 1000;
    when += beats * BEAT;
    playTimers.push(setTimeout(() => {
      document.querySelectorAll('.note.lit').forEach(e => e.classList.remove('lit'));
      const head = document.querySelector('.note[data-i="' + i + '"]');
      if (head) {
        head.classList.add('lit');
        // keep the sounding note in view; scrollIntoView handles the
        // right-to-left direction correctly, unlike setting scrollLeft
        head.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }, at));
  });
  playTimers.push(setTimeout(stopHighlights, when * 1000 + 260));
});
document.getElementById('undo').addEventListener('click', () => { stopHighlights(); melody.pop(); draw(); });
document.getElementById('clear').addEventListener('click', () => { stopHighlights(); melody.length = 0; draw(); });

const lookBtn = document.getElementById("look");
lookBtn.addEventListener("click", () => {
  const day = document.body.getAttribute("data-look") === "day";
  document.body.setAttribute("data-look", day ? "night" : "day");
  lookBtn.textContent = day ? "רקע בהיר" : "רקע כהה";
  draw();
});

/* ---------- the magic wand ---------- */
const WAND_EVERY = 20000;   // it drops by this often
const WAND_STAYS = 8000;    // and waits this long to be taken
const WAND_MIN_NOTES = 3;        // a whole note only teaches something inside a real little tune
const WAND_AFTER_TUNE = 5000;    // counted from the note that completes that tune
const CHIME_LEAD = 1300;    // the chime finishes before the voice begins
const wandEl = document.getElementById("wand");
const wandVoice = document.getElementById("wandVoice");
wandVoice.volume = 0.5;   // a voice at full level in a quiet room startles
let wandHeld = false;
let wandExplained = false;
let wandLeaveTimer = null;

// A rising sparkle so the wand is heard arriving before anyone speaks.
function wandChime() {
  const ac = audio();
  const t0 = ac.currentTime + 0.02;
  [1046.5, 1318.5, 1568.0, 2093.0].forEach((f, i) => {
    const at = t0 + i * 0.11;
    const g = ac.createGain();
    g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.11, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.85);
    const osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(f, at);
    const shimmer = ac.createOscillator();
    shimmer.type = "sine";
    shimmer.frequency.setValueAtTime(f * 2.02, at);
    const sg = ac.createGain();
    sg.gain.setValueAtTime(0.18, at);
    osc.connect(g); shimmer.connect(sg); sg.connect(g);
    osc.start(at); osc.stop(at + 0.9);
    shimmer.start(at); shimmer.stop(at + 0.9);
  });
}

function wandArrive() {
  if (wandEl.classList.contains("here") || melody.length < WAND_MIN_NOTES) return;
  wandEl.classList.add("here");
  wandChime();

  // Hani explains the wand the first time it ever shows up, and only then.
  // The wand waits out the whole explanation rather than leaving mid-sentence.
  if (!wandExplained) {
    wandExplained = true;
    setTimeout(() => {
      wandVoice.volume = 0.5;
      wandVoice.play().catch(() => {});
      const spoken = (wandVoice.duration || 13) * 1000;
      clearTimeout(wandLeaveTimer);
      wandLeaveTimer = setTimeout(wandLeave, spoken + 5000);
    }, CHIME_LEAD);
    clearTimeout(wandLeaveTimer);
    wandLeaveTimer = setTimeout(wandLeave, CHIME_LEAD + 20000);   // replaced once the length is known
    return;
  }

  clearTimeout(wandLeaveTimer);
  wandLeaveTimer = setTimeout(wandLeave, WAND_STAYS);
}

function wandLeave() {
  wandEl.classList.remove("here", "held");
  wandHeld = false;
  document.querySelectorAll(".note.pickable").forEach(n => n.classList.remove("pickable"));
}

wandEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  wandHeld = true;
  wandEl.classList.add("held");
  clearTimeout(wandLeaveTimer);   // holding it stops the clock
  document.querySelectorAll(".note").forEach(n => {
    if (!n.classList.contains("whole")) n.classList.add("pickable");
  });
});

// one tap on a note spends the wand
document.getElementById("staff").addEventListener("pointerdown", e => {
  if (!wandHeld) return;
  const g = e.target.closest(".note");
  if (!g || g.classList.contains("whole")) return;
  const i = Number(g.getAttribute("data-i"));
  melody[i].whole = true;
  wandLeave();
  draw();
  callPlay();
});

// Counting from page load meant the wand checked an empty staff, gave up, and
// came back only a full interval later - a child who took six seconds to pick a
// first friend waited half a minute. The clock now starts when the child has a
// tune worth changing: one note held long says nothing, but one long note among
// three short ones is the whole lesson, heard in a single press.
let wandCycleStarted = false;
function startWandCycle() {
  if (wandCycleStarted || melody.length < WAND_MIN_NOTES) return;
  wandCycleStarted = true;
  setTimeout(() => {
    wandArrive();
    setInterval(wandArrive, WAND_EVERY);
  }, WAND_AFTER_TUNE);
}

// a turned phone or a resized window changes how much staff fits
let resizeTimer = null;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 120);
});

draw();
</script>
